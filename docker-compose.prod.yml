# Production overlay for the company servers (private IPs).
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# Passing -f explicitly also stops docker-compose.override.yml from loading,
# so postgres and backend stay unpublished and only nginx faces the network.
services:
  frontend:
    ports:
      - "80:80"              # users open http://<server-private-ip>/

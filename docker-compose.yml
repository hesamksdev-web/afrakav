services:
  postgres:
    image: postgres:16-alpine
    container_name: afrashodan-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-afrashodan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-afrashodan}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-afrashodan} -d ${POSTGRES_DB:-afrashodan}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    image: afranet/afrashodan-backend
    container_name: afrashodan-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AFRASHODAN_ADDR: ":8080"
      DATABASE_URL: "postgres://${POSTGRES_USER:-afrashodan}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-afrashodan}?sslmode=disable"
      # Secrets come from the .env file next to this compose file — never commit it.
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      # Optional demo customer, seeded with the bundled sample scan on first boot.
      # Leave both empty (the default) to skip it in production.
      DEMO_USER: ${DEMO_USER:-}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
      AFRASHODAN_SEED: "/app/data/sample.nessus"
    ports:
      - "8080:8080"          # exposed for direct API access / debugging
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 8s
    restart: unless-stopped

  frontend:
    build:
      context: .
    image: afranet/afrashodan-frontend
    container_name: afrashodan-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8081:80"            # open http://localhost:8081
    restart: unless-stopped

volumes:
  pgdata:

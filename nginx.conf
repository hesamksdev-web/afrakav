# Login is the one endpoint worth brute-forcing, so it gets its own budget:
# five attempts up front, then one every twelve seconds per client address.
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Don't advertise the exact nginx build.
    server_tokens off;

    # Allow large .nessus uploads to pass through to the backend.
    client_max_body_size 64m;

    include /etc/nginx/security-headers.inc;

    # Rate-limited login, covering both the password step and /api/login/mfa.
    # Six guesses a minute is nowhere near enough to walk a 6-digit code.
    location /api/login {
        limit_req zone=login burst=5 nodelay;
        limit_req_status 429;
        include /etc/nginx/security-headers.inc;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/proxy-api.inc;
    }

    # Proxy API calls to the Go backend service (same origin → no CORS needed).
    # Scan results are confidential: never let a browser or proxy keep a copy.
    location /api/ {
        include /etc/nginx/security-headers.inc;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/proxy-api.inc;
    }

    # Hashed build assets are immutable — cache them forever.
    location /assets/ {
        include /etc/nginx/security-headers.inc;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # SPA fallback: serve index.html for client-side routes.
    # Never cache it, so new deployments show up on a plain refresh.
    location / {
        include /etc/nginx/security-headers.inc;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}

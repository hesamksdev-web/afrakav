# TLS variant of nginx.conf, mounted over it by docker-compose.tls.yml once
# ./certs holds a certificate. Same locations and rules as the plain config,
# plus HSTS and a redirect off port 80.
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

server {
    listen 80;
    server_name _;
    server_tokens off;

    # Nothing is served over plain HTTP — tokens and scan data never travel
    # unencrypted, not even for one redirected request.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size 64m;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1h;

    # Only meaningful over TLS, which is why it lives here and not in the
    # shared header file.
    add_header Strict-Transport-Security "max-age=31536000" always;
    include /etc/nginx/security-headers.inc;

    location /api/login {
        limit_req zone=login burst=5 nodelay;
        limit_req_status 429;
        add_header Strict-Transport-Security "max-age=31536000" always;
        include /etc/nginx/security-headers.inc;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/proxy-api.inc;
    }

    location /api/ {
        add_header Strict-Transport-Security "max-age=31536000" always;
        include /etc/nginx/security-headers.inc;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/proxy-api.inc;
    }

    location /assets/ {
        add_header Strict-Transport-Security "max-age=31536000" always;
        include /etc/nginx/security-headers.inc;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        add_header Strict-Transport-Security "max-age=31536000" always;
        include /etc/nginx/security-headers.inc;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}

packages:
  - '.'

# One @types/react in the tree: lucide-react pulls a v19 copy that is
# incompatible with the React 18 types the app is written against.
overrides:
  vite: 6.3.5
  '@types/react': 18.3.12
  '@types/react-dom': 18.3.1
allowBuilds:
  '@tailwindcss/oxide': set this to true or false
  esbuild: set this to true or false
dangerouslyAllowAllBuilds: true
supportedArchitectures:
  os:
    - linux
    - darwin
  cpu:
    - x64
    - arm64
  libc:
    - glibc
    - current
